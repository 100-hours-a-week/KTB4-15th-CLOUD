name: terraform-pr

# 모든 PR에서 실행한다 (paths 필터 없음)
# - 이 job을 main 브랜치 보호의 필수 체크로 지정하기 위함
# - paths 필터가 있으면 인프라와 무관한 PR에서 workflow가 시작되지 않아
#   필수 체크가 "Waiting for status to be reported"로 남아 merge할 수 없다
on:
  pull_request:
    branches: [main]

permissions:
  id-token: write        # OIDC
  contents: read
  pull-requests: write   # plan 코멘트

concurrency:
  group: terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: infra/environments

jobs:
  # lint와 plan을 하나의 job에서 실행 (runner 부팅, checkout, init을 한 번만)
  # job 이름(terraform)이 브랜치 보호의 필수 체크 이름이므로 바꾸지 않는다
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION }}

      # AWS 권한이 필요 없는 검사를 먼저 실행해 빠르게 실패하게 한다
      - name: terraform fmt
        run: terraform fmt -check -recursive ..

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: |
          tflint --init
          tflint --format compact

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        run: |
          terraform plan -input=false -no-color -lock=false -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('infra/environments/plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated)';

            const marker = '<!-- terraform-plan -->';
            const body = `${marker}\n### Terraform plan\n커밋: ${context.payload.pull_request.head.sha.slice(0, 7)}\n\`\`\`\n${plan}\n\`\`\``;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }