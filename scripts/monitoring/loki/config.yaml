# Loki 단일 바이너리 (dev, prod)
# - 저장소: S3 (청크·색인). 로컬 /loki(Docker volume)에는 WAL, 색인 캐시, compactor 작업 파일만 둔다.
#   2026-10-23 전환 때 로컬 파일시스템에 있던 로그는 버렸다 (옮기지 않음).
# - S3 버킷 이름은 -config.expand-env=true로 환경변수 LOKI_S3_BUCKET에서 읽는다 (서버 .env)
# - 자격 증명: EC2 인스턴스 역할 (IMDSv2)
# - 보존: 30일 (compactor가 S3에서 삭제). 앱 로그를 CloudWatch로 보내지 않으므로 앱 로그 보관처다 (2026-10-26 7일 → 30일)
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    s3:
      region: ap-northeast-2
      bucketnames: ${LOKI_S3_BUCKET}

schema_config:
  configs:
    - from: 2026-10-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_series: 5000
  max_query_parallelism: 8

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: s3

analytics:
  reporting_enabled: false
