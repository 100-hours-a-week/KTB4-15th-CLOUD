# Tempo 3.1 단일 바이너리 (dev, -target=all, Kafka 없음)
# - 수신: OTLP gRPC :4317 (compose 내부에서 Alloy만 보낸다. 호스트에 열지 않는다)
# - 저장: S3 (블록). 로컬 /var/tempo(Docker volume)에는 live-store WAL과 metrics-generator WAL만 둔다
# - S3 버킷 이름은 -config.expand-env=true로 환경변수 TEMPO_S3_BUCKET에서 읽는다 (서버 .env)
# - 자격 증명: EC2 인스턴스 역할 (IMDSv2). access_key·secret_key를 쓰지 않는다
# - 보존: 7일 (backend_scheduler·backend_worker block_retention)
# - 기준 예시: grafana/tempo v3.1.1 example/docker-compose/single-binary/tempo.yaml
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"

live_store:
  wal:
    path: /var/tempo/live-store/traces

storage:
  trace:
    backend: s3
    s3:
      bucket: ${TEMPO_S3_BUCKET}
      endpoint: s3.ap-northeast-2.amazonaws.com
      region: ap-northeast-2

# 보존 7일: 3.x는 스케줄러가 삭제 작업을 계획하고 워커가 실행한다. 기본값(336h)이 남지 않게 두 곳 모두 둔다
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 168h

backend_worker:
  compaction:
    block_retention: 168h

# 트레이스로 지표 생성 → Prometheus remote write (서비스 그래프, 스팬 지표)
metrics_generator:
  registry:
    external_labels:
      source: tempo
  processor:
    # 서비스 그래프 노드 이름
    # - database_name_attributes: DB 노드. db.system(mysql, postgresql)만 쓴다
    #   (기본값 db.namespace → db.name → db.system 이면 spring은 RDS 호스트, fastapi는 DB 이름으로 나와 노드가 제각각)
    # - peer_attributes: 그 밖의 외부 노드(SQS 등). peer.service → db.system → server.address
    service_graphs:
      database_name_attributes: ["db.system"]
      peer_attributes: ["peer.service", "db.system", "server.address"]
    # 스팬 지표에 DB 종류를 붙인다 (db_system 레이블, DB 구간만 값이 있다). 트레이스 대시보드 DB 행에서 쓴다
    span_metrics:
      dimensions: ["db.system"]
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: false

overrides:
  defaults:
    metrics_generator:
      processors: ["service-graphs", "span-metrics"]
      generate_native_histograms: classic

usage_report:
  reporting_enabled: false
