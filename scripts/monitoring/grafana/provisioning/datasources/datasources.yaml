apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # 로그 → 트레이스
      # - trace_id: structured metadata trace_id(앱·쿼리 로그)로 Tempo 트레이스를 바로 연다
      # - alb_trace_id: ALB 로그의 X-Amzn-Trace-Id Root. spring이 이 헤더를 구간 속성으로 남기므로 TraceQL로 찾는다
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Tempo
        - name: alb_trace_id
          matcherType: label
          matcherRegex: alb_trace_id
          datasourceUid: tempo
          url: '{ span."http.request.header.x-amzn-trace-id" =~ ".*$${__value.raw}.*" }'
          urlDisplayLabel: Tempo (ALB)

  # 트레이스 → 로그: 구간의 service.name을 Loki service 레이블로, trace_id로 거른다
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: service
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false

  # 인스턴스 역할로 인증한다 (CloudWatch 메트릭·Logs Insights 조회)
  - name: CloudWatch
    uid: cloudwatch
    type: cloudwatch
    jsonData:
      authType: default
      defaultRegion: ap-northeast-2
    editable: false
