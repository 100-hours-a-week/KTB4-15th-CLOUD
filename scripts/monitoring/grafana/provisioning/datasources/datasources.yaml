apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false

  # 인스턴스 역할로 인증한다 (CloudWatch 메트릭·Logs Insights 조회)
  - name: CloudWatch
    uid: cloudwatch
    type: cloudwatch
    jsonData:
      authType: default
      defaultRegion: ap-northeast-2
    editable: false
