global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: dev

# 호스트 메트릭은 Alloy가 수집해 remote write로 넣는다.
# 여기서는 모니터링 구성요소 자체만 scrape한다.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
