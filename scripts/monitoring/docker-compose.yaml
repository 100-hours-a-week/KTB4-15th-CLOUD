name: monitoring

# 모니터링 서버 (/opt/monitoring, dev·prod 공용)
# - 환경별 값은 서버 .env에 둔다 (README): MONITORING_ENV, Grafana 주소·프록시 허용 대역, DB 로그 대상 등
# - 데이터는 Docker named volume(루트 디스크)에 둔다. 인스턴스 교체 시 메트릭 유실을 감수한다 (로그·트레이스는 S3).
# - 외부(ECS task 등)에 여는 포트는 Grafana 3000, Alloy 3500(Loki push)뿐이다.
#   나머지는 127.0.0.1에만 열어 SSM 포트포워딩으로 확인한다.

services:
  prometheus:
    # v3.5.0에는 ECS 디스커버리(aws_sd_configs role: ecs)가 없어 올렸다 (3.x 안에서 설정·데이터 호환)
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      # 환경별 파일: prometheus.dev.yml, prometheus.prod.yml
      - --config.file=/etc/prometheus/prometheus.${MONITORING_ENV:?MONITORING_ENV is required}.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=10GB
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      # 파일 대신 폴더를 연결한다: 파일을 새로 바꿔 넣어도(install) 컨테이너가 새 내용을 본다
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 1g

  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yaml
      - -config.expand-env=true
    environment:
      LOKI_S3_BUCKET: ${LOKI_S3_BUCKET:?LOKI_S3_BUCKET is required}
    volumes:
      - ./loki:/etc/loki:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    mem_limit: 1g

  alloy:
    image: grafana/alloy:v1.8.0
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      # 레이블 env, 로그 그룹 경로(/lookddak/<env>/v2/...), AWS 태그 검색(Environment=<env>)
      MONITORING_ENV: ${MONITORING_ENV:?MONITORING_ENV is required}
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    ports:
      - "3500:3500"
      # 앱 Task의 OTLP 트레이스 수신 (SG로 nextjs·spring·fastapi Task만 허용)
      # 4317 gRPC(spring), 4318 HTTP(nextjs·fastapi)
      - "4317:4317"
      - "4318:4318"
      - "127.0.0.1:12345:12345"
    # 트레이스 수신(otelcol) 추가로 384m → 512m
    mem_limit: 512m
    depends_on:
      - prometheus
      - loki
      - tempo

  grafana:
    image: grafana/grafana:12.0.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:?GRAFANA_ROOT_URL is required}
      # 자동 로그인: ALB(Cognito 인증)가 넘기는 사용자 ID(UUID) 헤더로 로그인
      # - 헤더는 ALB 서브넷(.env GRAFANA_PROXY_WHITELIST)에서 온 요청만 믿는다.
      # - 처음 들어온 사용자는 Editor로 자동 생성된다.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-Amzn-Oidc-Identity
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_WHITELIST: ${GRAFANA_PROXY_WHITELIST:?GRAFANA_PROXY_WHITELIST is required}
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Editor
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # 접속 첫 화면: 서비스 별 지표 및 로그 (ecs-task.json)
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/ecs-task.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    # 실사용 약 260MiB로 256m 한도에 붙어 있어 올림 (2026-10-24 실측)
    mem_limit: 384m
    depends_on:
      - prometheus
      - loki

  # DB exporter: RDS에는 설치할 수 없어 이 서버에서 RDS로 접속해 지표를 읽는다.
  # - 계정은 읽기 전용(exporter), 비밀번호는 Parameter Store에만 둔다.
  # - TLS는 RDS CA(rds-ca/global-bundle.pem)로 인증서와 호스트 이름까지 검증한다.
  # - mysqld-exporter/my.cnf, rds-ca/는 저장소에 두지 않고 서버에서 만든다 (README).
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.20.0
    restart: unless-stopped
    command:
      - --config.my-cnf=/etc/mysqld-exporter/my.cnf
    volumes:
      - ./mysqld-exporter:/etc/mysqld-exporter:ro
      - ./rds-ca:/etc/rds-ca:ro
    ports:
      - "127.0.0.1:9104:9104"
    mem_limit: 64m

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: ${POSTGRES_EXPORTER_HOST:?POSTGRES_EXPORTER_HOST is required}:5432/lookddak?sslmode=verify-full&sslrootcert=/etc/rds-ca/global-bundle.pem
      DATA_SOURCE_USER: exporter
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?POSTGRES_EXPORTER_PASSWORD is required}
    volumes:
      - ./rds-ca:/etc/rds-ca:ro
    ports:
      - "127.0.0.1:9187:9187"
    mem_limit: 64m

  # DB 쿼리 로그 수집기: RDS 로그 파일을 RDS API로 이어 읽어 Alloy(:3500) → Loki로 보낸다 (CloudWatch 미사용)
  # - MySQL 감사 로그(audit/), 오류 로그(error/), 슬로우 쿼리 로그(slowquery/), PostgreSQL 로그(error/postgresql.log*)
  # - 읽은 위치는 db-log-tailer-state 볼륨에 둔다. 인스턴스 역할(IMDS)로 AWS에 접근한다.
  db-log-tailer:
    build: ./db-log-tailer
    image: lookddak/db-log-tailer:local
    restart: unless-stopped
    environment:
      # <엔진>:<RDS 인스턴스 ID>:<로그 파일 접두사>,... (README)
      TARGETS: ${DB_LOG_TARGETS:?DB_LOG_TARGETS is required}
      AWS_REGION: ap-northeast-2
      POLL_SECONDS: "5"
      # PostgreSQL 쿼리 외 로그(오류, 체크포인트 등)도 보낸다 (source="rds"). PG CloudWatch 구독은 쓰지 않는다
      PG_SEND_OTHER: "true"
      LOKI_URL: http://alloy:3500/loki/api/v1/push
    volumes:
      - db-log-tailer-state:/state
    ports:
      - "127.0.0.1:9200:9200"
    mem_limit: 128m
    depends_on:
      - alloy

  # 트레이스 저장소: Alloy가 보낸 트레이스를 받아 S3에 블록으로 저장하고, Grafana가 :3200으로 조회한다
  # - OTLP :4317은 compose 내부에서만 쓴다 (호스트 :4317은 Alloy)
  # - S3 버킷 이름은 서버 .env의 TEMPO_S3_BUCKET
  tempo:
    image: grafana/tempo:3.1.1
    restart: unless-stopped
    command:
      - -target=all
      - -config.file=/etc/tempo/config.yaml
      - -config.expand-env=true
    environment:
      TEMPO_S3_BUCKET: ${TEMPO_S3_BUCKET:?TEMPO_S3_BUCKET is required}
    volumes:
      - ./tempo:/etc/tempo:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    mem_limit: 768m

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
  db-log-tailer-state:
  tempo-data:
