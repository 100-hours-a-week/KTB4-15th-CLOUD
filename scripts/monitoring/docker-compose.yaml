name: monitoring

# dev 모니터링 서버 (/opt/monitoring)
# - 데이터는 Docker named volume(루트 디스크)에 둔다. 인스턴스 교체 시 유실을 감수한다 (dev).
# - 외부(ECS task 등)에 여는 포트는 Grafana 3000, Alloy 3500(Loki push)뿐이다.
#   나머지는 127.0.0.1에만 열어 SSM 포트포워딩으로 확인한다.

services:
  prometheus:
    # v3.5.0에는 ECS 디스커버리(aws_sd_configs role: ecs)가 없어 올렸다 (3.x 안에서 설정·데이터 호환)
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=10GB
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 1g

  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    mem_limit: 1g

  alloy:
    image: grafana/alloy:v1.8.0
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    ports:
      - "3500:3500"
      - "127.0.0.1:12345:12345"
    mem_limit: 384m
    depends_on:
      - prometheus
      - loki

  grafana:
    image: grafana/grafana:12.0.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://grafana.dev.lookddak.com
      # 자동 로그인: ALB(Cognito 인증)가 넘기는 사용자 ID(UUID) 헤더로 로그인
      # - 헤더는 ALB 서브넷(10.30.1.0/24, 10.30.2.0/24)에서 온 요청만 믿는다.
      # - 처음 들어온 사용자는 Editor로 자동 생성된다.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-Amzn-Oidc-Identity
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_WHITELIST: 10.30.1.0/24, 10.30.2.0/24
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Editor
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    mem_limit: 256m
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
