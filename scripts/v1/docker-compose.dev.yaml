# dev 서버 전용 덮어쓰기 파일 (prod docker-compose.yaml 위에 겹쳐 사용)
# - 사용: dev 서버 .env에 COMPOSE_FILE=docker-compose.yaml:docker-compose.dev.yaml
#   (docker compose가 .env의 COMPOSE_FILE을 읽어 두 파일을 합친다)
# - 로그: prod와 같은 awslogs 드라이버를 쓰고 로그 그룹만 /lookddak/dev/*로 바꾼다.
#   (드라이버가 같으면 options가 합쳐지고, 같은 키(awslogs-group)만 dev 값으로 바뀐다)
# - Nginx 설정은 dev 도메인용 conf.d.dev를 마운트한다. (같은 컨테이너 경로라 prod 마운트를 대체)

services:
  nginx:
    volumes:
      - ./nginx/conf.d.dev:/etc/nginx/conf.d:ro
    logging:
      options:
        awslogs-group: /lookddak/dev/nginx

  nextjs:
    logging:
      options:
        awslogs-group: /lookddak/dev/nextjs

  spring:
    logging:
      options:
        awslogs-group: /lookddak/dev/spring

  fastapi:
    depends_on:
      pgbouncer:
        condition: service_healthy
    environment:
      BODY_IMAGE_VALIDATION_URL: "${BODY_IMAGE_VALIDATION_URL:?BODY_IMAGE_VALIDATION_URL is required}"
      BODY_IMAGE_VALIDATION_PROXY_KEY: "${BODY_IMAGE_VALIDATION_PROXY_KEY:?BODY_IMAGE_VALIDATION_PROXY_KEY is required}"
      BODY_IMAGE_VALIDATION_PROXY_SECRET: "${BODY_IMAGE_VALIDATION_PROXY_SECRET:?BODY_IMAGE_VALIDATION_PROXY_SECRET is required}"
      BODY_IMAGE_VALIDATION_API_KEY: "${BODY_IMAGE_VALIDATION_API_KEY:?BODY_IMAGE_VALIDATION_API_KEY is required}"
    logging:
      options:
        awslogs-group: /lookddak/dev/fastapi
    deploy:
      resources:
        limits:
          cpus: "1.0"

  postgresql:
    # RDS 논리 복제 연결을 EC2 사설 IP의 5432에서 받는다.
    ports:
      - "${POSTGRES_BIND_IP:?POSTGRES_BIND_IP is required}:5432:5432"
    logging:
      options:
        awslogs-group: /lookddak/dev/postgresql
    deploy:
      resources:
        limits:
          memory: 768M

  # Dev에서만 추가한다. postgresql 서비스와 데이터 볼륨은 변경하지 않는다.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.0-p0@sha256:b17551c776ef7e5769ef80b956d20f85e2fd25dd8912d31d58f782aad495b711
    container_name: lookddak-pgbouncer
    restart: always
    expose:
      - "6432"
    networks:
      - db-network
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/pg_hba.conf:/etc/pgbouncer/pg_hba.conf:ro
      - ./pgbouncer/pg_ident.conf:/etc/pgbouncer/pg_ident.conf:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "/var/run/pgbouncer", "-p", "6432", "-U", "pgbouncer_admin", "-d", "pgbouncer"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    # 새 CloudWatch/IAM 리소스 없이 제한된 크기의 로컬 로그를 남긴다.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # Lightweight load generator used only for Dev DB migration rehearsals.
  # It stays idle until a pgbench command is executed and publishes no host port.
  pgbench:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    container_name: lookddak-pgbench
    profiles: ["rehearsal"]
    restart: unless-stopped
    init: true
    command: ["sleep", "infinity"]
    working_dir: /work
    volumes:
      - ./scripts/migration/postgres/rehearsal/workload/pgbench:/scripts:ro
      - ./scripts/migration/postgres/rehearsal/results:/results
    networks:
      - db-network
    depends_on:
      pgbouncer:
        condition: service_healthy
    environment:
      PGHOST: pgbouncer
      PGPORT: "6432"
      PGDATABASE: lookddak_ai
      PGUSER: lookddak_app
      PGCONNECT_TIMEOUT: "5"
      PGAPPNAME: lookddak-pgbench
      TZ: KST-9
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /work:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pgbench", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    stop_grace_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 64
