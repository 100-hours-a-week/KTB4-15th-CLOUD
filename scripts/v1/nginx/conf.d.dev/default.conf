# /opt/lookddak/nginx/conf.d.dev/default.conf (dev 서버 전용, docker-compose.dev.yaml에서 마운트)
# prod nginx/conf.d/default.conf와 같고 도메인은 dev.lookddak.com (www 리다이렉트 없음), 요청 제한 없음
# nginx.conf의 http { } 안에 include되는 파일

# Docker DNS
resolver 127.0.0.11 valid=10s ipv6=off;

# 요청 속도·동시 요청 제한 없음 (dev)
# - V2 ALB 뒤에서는 nginx가 보는 클라이언트 IP가 ALB IP라 IP 기준 제한이 모든 사용자에게 함께 걸린다.
# - 로그 형식 호환을 위해 access log의 req_limit, conn_limit 필드는 남겨 둔다 (값은 빈 값).

# 요청 추적 ID
# k6가 보낸 X-Request-ID는 그대로 사용하고, 헤더가 없는 일반 요청은 Nginx가 ID를 생성합니다.
map $http_x_request_id $lookddak_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# 응답시간 및 rate limit 결과 기록
log_format lookddak_timing
    '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
    'rt=$request_time urt=$upstream_response_time '
    'uaddr="$upstream_addr" ustatus="$upstream_status" '
    'req_limit="$limit_req_status" conn_limit="$limit_conn_status" '
    'request_id="$lookddak_request_id"';

# Next.js 정적 파일 캐시
proxy_cache_path /var/cache/nginx/next_static
    levels=1:2
    keys_zone=next_static:10m
    max_size=1g
    inactive=7d
    use_temp_path=off;

# Spring upstream
upstream spring_backend {
    zone spring_backend 64k;
    server spring:8080 resolve;

    keepalive 32;
    keepalive_timeout 30s;
}

# Next.js upstream
upstream nextjs_frontend {
    zone nextjs_frontend 64k;
    server nextjs:3000 resolve;

    keepalive 16;
    keepalive_timeout 30s;
}

# HTTP
server {
    listen 80;
    server_name dev.lookddak.com;

    access_log /var/log/nginx/access.log lookddak_timing;

    location = /healthz {
        access_log off;

        allow 127.0.0.1;
        deny all;

        default_type text/plain;
        return 200 "ok";
    }

    # Let's Encrypt 인증 경로
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # 워드프레스, 숨김 파일, 백업 파일 스캔 차단
    location ~* (^/(wp-|xmlrpc\.php)|/\.(?!well-known/)|\.(bak|old|sql|swp)$) {
        return 444;
    }

    location / {
        return 301 https://dev.lookddak.com$request_uri;
    }
}

# 실제 서비스
server {
    listen 443 ssl;
    http2 on;
    server_name dev.lookddak.com;

    access_log /var/log/nginx/access.log lookddak_timing;

    ssl_certificate     /etc/nginx/ssl/live/dev.lookddak.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/dev.lookddak.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 공통 프록시 설정
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Nginx 접근 로그와 애플리케이션 로그에서 같은 요청을 찾을 수 있게 전달합니다.
    proxy_set_header X-Request-ID $lookddak_request_id;
    proxy_connect_timeout 3s;

    # 스캐너 차단
    location ~* (^/(wp-|xmlrpc\.php)|/\.(?!well-known/)|\.(bak|old|sql|swp)$) {
        return 444;
    }

    # Next.js 정적 파일
    location ^~ /_next/static/ {
        # Nginx 디스크 캐시
        proxy_cache next_static;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 7d;

        # 같은 파일의 동시 MISS는 Next.js에 한 번만 요청
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        # HIT, MISS, BYPASS 등 캐시 상태 표시
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://nextjs_frontend;
    }

    # Spring API
    location /api/ {
        client_max_body_size 10m;

        proxy_read_timeout 60s;
        proxy_pass http://spring_backend;
    }

    # Next.js 페이지 및 기타 URL
    location / {
        proxy_pass http://nextjs_frontend;
    }
}
