# /opt/lookddak/nginx/conf.d/default.conf
# nginx.conf의 http { } 안에 include되는 파일

# Docker DNS
resolver 127.0.0.11 valid=10s ipv6=off;

# IP별 요청 속도 제한
limit_req_zone $binary_remote_addr zone=api_ip:20m    rate=20r/s;
limit_req_zone $binary_remote_addr zone=static_ip:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=web_ip:30m    rate=30r/s;

# IP별 동시 요청 제한
limit_conn_zone $binary_remote_addr zone=api_conn_ip:10m;
limit_conn_zone $binary_remote_addr zone=web_conn_ip:10m;

# 모든 IP를 합친 API 전체 동시 요청 제한
limit_conn_zone $server_name zone=api_total:1m;

# 제한 초과 응답 코드
limit_req_status 429;
limit_conn_status 429;

# 응답시간 및 rate limit 결과 기록
log_format lookddak_timing
    '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
    'rt=$request_time urt=$upstream_response_time '
    'uaddr="$upstream_addr" ustatus="$upstream_status" '
    'req_limit="$limit_req_status" conn_limit="$limit_conn_status"';

# Next.js 정적 파일 캐시
proxy_cache_path /var/cache/nginx/next_static
    levels=1:2
    keys_zone=next_static:10m
    max_size=1g
    inactive=7d
    use_temp_path=off;

# Spring upstream
upstream spring_backend {
    zone spring_backend 64k;
    server spring:8080 resolve;

    keepalive 32;
    keepalive_timeout 30s;
}

# Next.js upstream
upstream nextjs_frontend {
    zone nextjs_frontend 64k;
    server nextjs:3000 resolve;

    keepalive 16;
    keepalive_timeout 30s;
}

# HTTP
server {
    listen 80;
    server_name lookddak.com www.lookddak.com;

    access_log /var/log/nginx/access.log lookddak_timing;

    location = /healthz {
        access_log off;

        allow 127.0.0.1;
        deny all;

        default_type text/plain;
        return 200 "ok";
    }

    # Let's Encrypt 인증 경로
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # 워드프레스, 숨김 파일, 백업 파일 스캔 차단
    location ~* (^/(wp-|xmlrpc\.php)|/\.(?!well-known/)|\.(bak|old|sql|swp)$) {
        return 444;
    }

    location / {
        return 301 https://lookddak.com$request_uri;
    }
}

# www HTTPS -> 기본 도메인 이동
server {
    listen 443 ssl;
    http2 on;
    server_name www.lookddak.com;

    access_log /var/log/nginx/access.log lookddak_timing;

    ssl_certificate     /etc/nginx/ssl/live/lookddak.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/lookddak.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://lookddak.com$request_uri;
}

# 실제 서비스
server {
    listen 443 ssl;
    http2 on;
    server_name lookddak.com;

    access_log /var/log/nginx/access.log lookddak_timing;

    ssl_certificate     /etc/nginx/ssl/live/lookddak.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/lookddak.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 공통 프록시 설정
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;

    # 스캐너 차단
    location ~* (^/(wp-|xmlrpc\.php)|/\.(?!well-known/)|\.(bak|old|sql|swp)$) {
        return 444;
    }

    # Next.js 정적 파일
    location ^~ /_next/static/ {
        # IP당 30r/s, 순간 초과분 100건
        limit_req zone=static_ip burst=100 nodelay;

        # IP당 동시 요청 최대 100개
        limit_conn web_conn_ip 100;

        # Nginx 디스크 캐시
        proxy_cache next_static;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 7d;

        # 같은 파일의 동시 MISS는 Next.js에 한 번만 요청
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        # HIT, MISS, BYPASS 등 캐시 상태 표시
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://nextjs_frontend;
    }

    # Spring API
    location /api/ {
        client_max_body_size 10m;

        # IP당 20r/s, 순간 초과분 40건
        limit_req zone=api_ip burst=40 nodelay;

        # IP 하나의 API 동시 요청 최대 50개
        limit_conn api_conn_ip 50;

        # 모든 IP를 합친 API 동시 요청 최대 100개
        limit_conn api_total 100;

        proxy_read_timeout 60s;
        proxy_pass http://spring_backend;
    }

    # Next.js 페이지 및 기타 URL
    location / {
        # IP당 30r/s, 순간 초과분 50건
        limit_req zone=web_ip burst=50 nodelay;

        # IP당 동시 요청 최대 100개
        limit_conn web_conn_ip 100;

        proxy_pass http://nextjs_frontend;
    }
}
