# FireLens(aws-for-fluent-bit init) 추가 출력: 앱 로그 → Alloy(loki.source.api :3500) → Loki
# - 출력 1(CloudWatch)은 앱 컨테이너 logConfiguration.options로 FireLens가 만든다.
# - ${SERVICE}: log-router 컨테이너 환경변수 (nextjs | spring | fastapi)
# - env="dev"는 Alloy(loki.write external_labels)가 붙인다.
# - 본문은 JSON: log(원문), source(stdout/stderr), container_name, ecs_task_arn
[OUTPUT]
    Name             loki
    Match            *
    Host             ${LOKI_HOST}
    Port             3500
    Labels           source=app, service=${SERVICE}
    Line_Format      json
    Remove_Keys      container_id, ecs_cluster, ecs_task_definition
    Retry_Limit      5
