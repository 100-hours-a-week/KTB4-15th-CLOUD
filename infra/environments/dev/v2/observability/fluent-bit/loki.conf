# FireLens(aws-for-fluent-bit init) 추가 설정: 여러 줄 합치기 + Task ID + Loki 출력
# - 출력 1(CloudWatch)은 앱 컨테이너 logConfiguration.options로 FireLens가 만든다. 아래 FILTER는 두 출력 모두에 적용된다.
# - 환경변수 (log-router 컨테이너): SERVICE (nextjs | spring | fastapi), MULTILINE_PARSER (parsers.conf의 이름)
# - Loki 레이블: source=app, service, task(Task ID 앞 8자리). env="dev"는 Alloy가 붙인다.
# - Loki 본문: 앱이 찍은 원문 그대로 (스택트레이스는 한 건으로 합쳐짐)

# 스택트레이스처럼 여러 줄로 찍힌 로그를 한 건으로 합친다
[FILTER]
    Name                  multiline
    Match                 *
    multiline.key_content log
    multiline.parser      ${MULTILINE_PARSER}

# ecs_task_arn에서 Task ID 앞 8자리만 꺼낸다 (Loki 레이블용)
[FILTER]
    Name    lua
    Match   *
    call    task_id
    code    function task_id(tag, ts, record) local arn = record["ecs_task_arn"] if arn ~= nil then local id = string.match(arn, "([^/]+)$") if id ~= nil then record["task"] = string.sub(id, 1, 8) end end return 2, ts, record end

[OUTPUT]
    Name             loki
    Match            *
    Host             ${LOKI_HOST}
    Port             3500
    Labels           source=app, service=${SERVICE}
    Label_Keys       $task
    Remove_Keys      container_id, container_name, ecs_cluster, ecs_task_arn, ecs_task_definition, source, task
    Drop_Single_Key  on
    Line_Format      key_value
    Retry_Limit      5
